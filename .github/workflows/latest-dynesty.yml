# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Test against latest dynesty

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONDA_PATH: /opt/conda/
  OMP_NUM_THREADS: 1

jobs:
  build:

    name: Latest dynesty
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        environments: latest-dynesty
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        locked: true

    - name: Run unit tests
      run: |
        pixi run -e latest-dynesty python -m pytest \
          --durations 10 -k dynesty
    - name: Run sampler tests
      run: |
        pixi run -e latest-dynesty python -m pytest \
          test/integration/sampler_run_test.py \
          --durations 10 -v -k dynesty

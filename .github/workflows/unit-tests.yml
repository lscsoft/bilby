# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Unit testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONDA_PATH: /opt/conda/
  SETUPTOOLS_SCM_IGNORE_DUBIOUS_OWNER: 1
  BILBY_TESTING_ROQ_DIR: ${{ github.workspace }}/.roq-data
  OMP_NUM_THREADS: 1

jobs:
  prepare-data:
    name: Download ROQ data
    runs-on: ubuntu-latest
    steps:
      - name: Cache test data
        id: test-data-cache
        uses: actions/cache@v4
        with:
          path: .roq-data
          key: roq-data-v1

      - name: Download test data
        if: steps.test-data-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .roq-data
          cd .roq-data
          wget https://git.ligo.org/lscsoft/ROQ_data/raw/master/IMRPhenomPv2/4s/B_linear.npy \
            && wget https://git.ligo.org/lscsoft/ROQ_data/raw/master/IMRPhenomPv2/4s/B_quadratic.npy \
            && wget https://git.ligo.org/lscsoft/ROQ_data/raw/master/IMRPhenomPv2/4s/fnodes_linear.npy \
            && wget https://git.ligo.org/lscsoft/ROQ_data/raw/master/IMRPhenomPv2/4s/fnodes_quadratic.npy \
            && wget https://git.ligo.org/lscsoft/ROQ_data/raw/master/IMRPhenomPv2/4s/params.dat \
            && wget https://git.ligo.org/soichiro.morisaki/roq_basis/raw/main/IMRPhenomD/16s_nospins/basis_addcal.hdf5 \
            && wget https://git.ligo.org/soichiro.morisaki/roq_basis/raw/main/IMRPhenomD/16s_nospins/basis_multiband_addcal.hdf5

  unit-tests:
    name: ${{ matrix.python.name }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - name: Python 3.11
            short-version: 311
            environment: py311
          - name: Python 3.12
            short-version: 312
            environment: py312
          - name: Python 3.13
            short-version: 313
            environment: py313

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        environments: ${{ matrix.python.environment }}
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        locked: true

    - name: Run tests
      run: |
        pixi run -e ${{ matrix.python.environment }} \
          pytest -m "not gw" . --ignore=test/gw --cov=bilby --cov-branch \
          --durations 10 -ra --color yes --cov-report=xml --junitxml=pytest.xml

    - name: Publish coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        flags: python${{ matrix.python.short-version }}
        slug: bilby-dev/bilby
    - name: Coverage report
      run: |
        pixi run -e ${{ matrix.python.environment }} \
          python -m coverage report --show-missing
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-${{ matrix.python.short-version }}
        path: pytest.xml

  gw-tests:
    name: ${{ matrix.python.name }} GW unit tests
    runs-on: ubuntu-latest
    needs: prepare-data
    strategy:
      fail-fast: false
      matrix:
        python:
          - name: Python 3.11
            short-version: 311
            environment: py311-gw
          - name: Python 3.12
            short-version: 312
            environment: py312-gw
          - name: Python 3.13
            short-version: 313
            environment: py313-gw

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Restore cached ROQ data
      id: test-data-cache
      uses: actions/cache/restore@v6
      with:
        path: .roq-data
        key: roq-data-v1

    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        environments: ${{ matrix.python.environment }}
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        locked: true

    - name: Run tests
      run: |
        pixi run -e ${{ matrix.python.environment }} \
          pytest -m gw . --cov=bilby --cov-branch \
          --durations 10 -ra --color yes --cov-report=xml --junitxml=pytest.xml

    - name: Publish coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        flags: python${{ matrix.python.short-version }}-gw
        slug: bilby-dev/bilby
    - name: Coverage report
      run: |
        pixi run -e ${{ matrix.python.environment }} \
          python -m coverage report --show-missing
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-gw-${{ matrix.python.short-version }}
        path: pytest.xml

  doc-tests:
    name: Python 3.13 docstring tests
    runs-on: ubuntu-latest
    env:
      BILBY_ARRAY_API: 1
      SCIPY_ARRAY_API: 1

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        environments: jax
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        locked: true

    - name: Run docstring tests
      run: |
        pixi run -e jax \
          python -m pytest --doctest-plus --doctest-modules bilby -v

  sampler-run:

    name: ${{ matrix.python.name }} run samplers
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python:
          - name: Python 3.11
            environment: py311
          - name: Python 3.12
            environment: py312
          - name: Python 3.13
            environment: py313

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        environments: ${{ matrix.python.environment }}
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        locked: true
    - name: Run sampler tests
      run: |
        pixi run -e ${{ matrix.python.environment }} \
          pytest test/integration/sampler_run_test.py --durations 10 -v

  array-backend:

    needs: prepare-data

    name: ${{ matrix.python.name }} array backend (${{ matrix.backend.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - name: Python 3.13
            short-version: 313
        backend:
          - name: numpy
            environment: numpy
          - name: jax
            environment: jax
          - name: torch
            environment: torch
    env:
      BILBY_ARRAY_API: 1
      SCIPY_ARRAY_API: 1

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Restore cached ROQ data
      id: test-data-cache
      uses: actions/cache/restore@v6
      with:
        path: .roq-data
        key: roq-data-v1

    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        environments: ${{ matrix.python.environment }}
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        locked: true

    - name: Run array-backend unit tests
      run: |
        pixi run -e ${{ matrix.backend.environment }} \
          pytest --array-backend ${{ matrix.backend.name }} --durations 10 --junitxml=pytest-array.xml
    - name: Publish coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        flags: python${{ matrix.backend.name }}
        slug: bilby-dev/bilby
    - name: Upload array-backend test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-array-${{ matrix.python.short-version }}-${{ matrix.backend.name }}
        path: pytest-array.xml

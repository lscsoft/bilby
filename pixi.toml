[dependencies]
array-api-compat = "*"
array-api-extra = "*"
attrs = "*"
corner = "*"
dill = "*"
emcee = "*"
h5py = "*"
matplotlib = "*"
numpy = "*"
pandas = "*"
plum-dispatch = "*"
scipy = ">=1.5"
setuptools_scm = "*"
tqdm = "*"

[environments]
documentation = ["py313", "gw", "doc", "test", "jax", "torch"]
jax = ["py313", "gw", "test", "array_api", "jax"]
latest-dynesty = ["py313", "gw", "test", "dynesty"]
numpy = ["py313", "gw", "test", "array_api"]
py311 = ["py311", "test"]
py311-gw = ["py311", "gw", "test"]
py312 = ["py312", "test"]
py312-gw = ["py312", "gw", "test"]
py313 = ["py313", "test"]
